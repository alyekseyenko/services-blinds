events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Otimização de Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M; # Suporte a fotos e anexos pesados

    # Configuração de Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # =========================================================================
    # 1. APP TÉCNICOS & ADMIN (ex: app.estoresrainha.pt)
    # =========================================================================
    server {
        listen 80;
        server_name app.estoresrainha.pt; # Substitua pelo seu domínio real

        # Cabeçalhos de Segurança
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            proxy_pass http://app-tecnicos:3000;
            proxy_http_version 1.1;
            
            # Suporte a WebSockets / Next.js Fast Refresh
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Cabeçalhos de Proxy & IP Real (Cloudflare)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }

    # =========================================================================
    # 2. TWENTY CRM (ex: crm.estoresrainha.pt)
    # =========================================================================
    server {
        listen 80;
        server_name crm.estoresrainha.pt; # Substitua pelo seu domínio real

        location / {
            proxy_pass http://twenty-server-1:3000;
            proxy_http_version 1.1;

            # Suporte a WebSockets (Notificações em tempo real do CRM)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Cabeçalhos de Proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
