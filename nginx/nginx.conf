events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Otimização de Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M; # Suporte a fotos e anexos pesados

    # Configuração de Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # =========================================================================
    # 1. TECHNICIAN & ADMIN APP (e.g. technicians.yourcompany.com)
    # =========================================================================
    server {
        listen 80;
        server_name technicians.yourcompany.com; # Replace with your real domain on the server

        # Cabeçalhos de Segurança
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /api/qa {
            proxy_pass http://app-tecnicos:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location / {
            proxy_pass http://app-tecnicos:3000;
            proxy_http_version 1.1;
            
            # Suporte a WebSockets / Next.js Fast Refresh
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Cabeçalhos de Proxy & IP Real (Cloudflare)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }

    # =========================================================================
    # 2. TWENTY CRM (e.g. crm.yourcompany.com)
    # =========================================================================
    server {
        listen 80;
        server_name crm.yourcompany.com; # Replace with your real domain on the server

        location / {
            proxy_pass http://twenty-server-1:3000;
            proxy_http_version 1.1;

            # SSE real-time updates (Twenty CRM) — required for live record sync
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # WebSocket support (notifications)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Cabeçalhos de Proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        }
    }
}
