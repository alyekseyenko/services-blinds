services:
  app-tecnicos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: technician-app
    restart: always
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3005:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - TWENTY_API_URL=http://twenty-server-1:3000
      - REDIS_URL=redis://technician-cache:6379
      - APP_DATA_DIR=/app/data
    volumes:
      - technician-app-data:/app/data
    networks:
      - app-network
    depends_on:
      - technician-cache

  # Unique service name — do NOT use "redis" on twenty_default (collides with Twenty CRM).
  technician-cache:
    image: redis:alpine
    container_name: technician-redis
    hostname: technician-cache
    restart: always
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - yes
    expose:
      - "6379"
    volumes:
      - technician-redis-data:/data
    networks:
      - app-network

  # Optional — production VPS uses host nginx (HTTPS). Avoid binding :80 here (conflicts + crash-loop).
  nginx:
    profiles:
      - with-docker-nginx
    image: nginx:alpine
    container_name: technician-nginx
    restart: always
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - app-tecnicos

networks:
  app-network:
    external: true # Twenty CRM runs on this Docker network
    name: twenty_default

volumes:
  technician-app-data:
  technician-redis-data:
